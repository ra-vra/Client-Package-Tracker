<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#222a25;--mute:#7b857f;--line:#e3ebe5;--accent:#8fd19e;--accent2:#6cc08a;--btn:#a8e0b5;--btnink:#17482b;--warn:#d9534f;--track:#edf5ef;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:0 auto;min-height:100vh}
header{padding:18px 18px 8px}
.gear{margin-left:auto;width:42px;height:42px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.dd{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0 4px;font-weight:650;cursor:pointer}
.dd svg{transition:transform .2s}.dd.open svg{transform:rotate(180deg)}
.seg{display:flex;gap:10px;margin-top:4px}.seg button{flex:1;background:var(--track);color:var(--mute)}.seg .dis.on,.pill.dis{background:#f9d6d6;color:#8f2020}.seg .nodis.on,.pill.nodis{background:#cdeed6;color:#17482b}
.shutter{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.4,0,.2,1)}.shutter.open{grid-template-rows:1fr}.shutter>div{overflow:hidden;min-height:0}
.shutter .card{opacity:0;transform:translateY(-16px);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1)}.shutter.open .card{opacity:1;transform:none}
.shutter.open .card:nth-child(2){transition-delay:.07s}.shutter.open .card:nth-child(3){transition-delay:.14s}.shutter.open .card:nth-child(n+4){transition-delay:.2s}
.shutter .empty{opacity:0;transition:opacity .4s}.shutter.open .empty{opacity:1}
textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:70px;font-size:12px}
.stat.tap{cursor:pointer}
.skipi,.skipc{font-size:13px;padding:11px 8px}.skipi{background:#e2e2e2;color:#4a4a4a}.skipc{background:#f9d6d6;color:#8f2020}
.dates .skipI{background:#e2e2e2;color:#4a4a4a}.dates .skipC{background:#f9d6d6;color:#8f2020}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cg span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px}
.cg .wd{aspect-ratio:auto;font-size:11px;color:var(--mute)}.dy.out{color:#d2d2d2}.dy.in{background:#fff;border:1px solid var(--line)}
.dy.t{background:#8fd19e!important;border-color:#8fd19e!important;color:#17482b;font-weight:700}.dy.i{background:#d9d9d9!important;border-color:#d9d9d9!important;color:#444}.dy.c{background:#f9d6d6!important;border-color:#f9d6d6!important;color:#8f2020}
.dy.today{outline:2px solid var(--ink);outline-offset:1px}.cmt{font-weight:650;margin:16px 0 8px}
.lg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--mute);margin-top:16px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
#splash{position:fixed;inset:0;background:#fff;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
#splash img{width:150px;height:150px;object-fit:contain;opacity:0;animation:spl 2.3s ease-in-out forwards}
@keyframes spl{0%{opacity:0;transform:scale(.88)}35%{opacity:1;transform:scale(1)}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
header,main{transition:opacity .9s ease}body.loading header,body.loading main{opacity:0}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mk button{min-height:58px;padding:8px 6px;font-size:13px;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center}
@keyframes pf{0%{opacity:.3;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
.fx{animation:pf .45s ease-out}
#login{position:fixed;inset:0;background:#fff;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
.gbtn{background:#fff;border:1px solid #dadce0;color:#222;width:100%;max-width:320px;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:6px}
.avl{width:84px;height:84px;border-radius:50%;object-fit:cover;margin-bottom:6px;border:3px solid var(--btn)}
.pid{display:flex;gap:12px;margin-top:10px}.pcol{flex:1;text-align:center}
.slot{aspect-ratio:1.3;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;color:var(--mute);font-size:13px;background:var(--bg);overflow:hidden}
.slot.has{border:1.5px solid var(--btn);color:var(--btnink);background:var(--track)}.slot img{width:100%;height:100%;object-fit:cover}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:120;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1}

.top{display:flex;align-items:center;gap:12px}.logo{width:60px;height:60px;flex:none;object-fit:contain}
h1{margin:0;font-size:22px;letter-spacing:.2px}
h1 span{color:var(--accent2)}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
main{padding:8px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;display:flex;gap:14px;align-items:center}
.card.tap{cursor:pointer}
.grow{flex:1;min-width:0}
.name{font-weight:650;font-size:16px}
.meta{color:var(--mute);font-size:13px;margin-top:3px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--track);margin-top:6px}
.pill.warn{background:var(--warn);color:#fff}.pill.ok{background:var(--btn);color:var(--btnink)}
.done-name{color:#a3a3a3;text-decoration:line-through;text-decoration-color:#c9c9c9}
.banner{background:var(--warn);color:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:14px}
.banner b{display:block;margin-bottom:4px}
.stats{display:flex;gap:10px;margin:6px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:17px}.stat span{font-size:12px;color:var(--mute)}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--btn);color:var(--btnink);font-weight:600;cursor:pointer}
button.ghost{background:var(--track);color:var(--btnink)}
button.danger{background:var(--warn)}
.fab{border:1px solid #8fd19e;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:99px;padding:15px 22px;font-size:16px}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{text-align:center;padding:10px 0 4px}
.actions{display:flex;gap:10px;margin:14px 0}.actions button{flex:1}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:0}
.dates button{padding:6px 10px;font-size:12px;border-radius:99px}
.call{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--btnink);text-decoration:none;flex:none}
.call.wa{background:#25D366;color:#fff}
.ct{display:flex;gap:8px;flex:none}
.call.lg{width:48px;height:48px;margin-top:0}
.dates .chip{padding:6px 12px;font-size:12px;border-radius:99px;background:var(--track);color:var(--btnink);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center}.hd button{padding:5px 12px;font-size:12px}
.back{background:none;color:var(--btnink);padding:6px 0;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}

<script>
let IMG={},idb=null;
let S={clients:[],remind:3},view='home',sel=null,ref=null,confirmDel=false,form=null,editDates=false,clientsOpen=false,animNext=false,lastSel=null,A=null,syncMsg='',syncT=null;
const SB='https://hbhvquibzbnoacsiudwi.supabase.co',KEY='sb_publishable_2-znlA3qPdbHgmnJX-oARQ_uikxJbda',isApp=!!(window.Android&&window.Android.openUrl);
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const dd=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=dd(s);d.setDate(d.getDate()+n);return fmt(d)};
const show=s=>dd(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const bal=c=>Math.max(Number(c.fee||0)-Number(c.paid||0),0);
const tel=p=>String(p||'').replace(/[^\d+]/g,'');
const callBtn=(c,cls)=>tel(c.phone)?`<a class="call ${cls||''}" href="tel:${tel(c.phone)}" aria-label="Call ${esc(c.name)}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.6a1 1 0 01-.25 1z"/></svg></a>`:'';
const wa=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d};
const waBtn=(c,cls)=>wa(c.phone).length>=11?`<a class="call wa ${cls||''}" href="https://wa.me/${wa(c.phone)}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(c.name)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.75-.86-2-.96-.28-.1-.48-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07a8.2 8.2 0 01-2.4-1.48 9 9 0 01-1.66-2.07c-.17-.3 0-.46.13-.6.14-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.62-.92-2.2-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.7.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.15l-.3-.18-3 .78.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/></svg></a>`:'';
const contact=(c,cls)=>(tel(c.phone)?callBtn(c,cls):'')+waBtn(c,cls);
const uid=()=>Math.random().toString(36).slice(2,9);

function info(c){
  const taught=c.taught.length,left=Math.max(c.sessions-taught,0);
  const end=addDays(c.start,c.duration);
  const days=Math.round((dd(end)-dd(today()))/864e5);
  const done=taught>=c.sessions;
  let status='ok',label=days+' days left';
  if(done){status='ok';label='All sessions taught'}
  else if(days<0){status='warn';label='Package ended '+(-days)+'d ago'}
  const due=!done&&days>=0&&(days<=S.remind||left<=2)||(!done&&days<0);
  if(due&&status!=='warn')status='warn';
  return{taught,left,end,days,done,due,status,label}
}
function ring(t,n,sz,sw,big,anim){
  const p=n?Math.min(t/n,1):0,r=(sz-sw)/2,c=2*Math.PI*r;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${p>=1?'#b5b5b5':'var(--accent2)'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${anim?c:c*(1-p)}" ${anim?'data-to="'+c*(1-p)+'"':''} transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:stroke-dashoffset ${anim?1.4:.5}s ease-out"/><text x="50%" y="${big?'46%':'54%'}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-weight="700" font-size="${big?34:15}">${t}/${n}</text>${big?`<text x="50%" y="64%" text-anchor="middle" fill="var(--mute)" font-size="12">days taught</text>`:''}</svg>`
}

function persist(){
  try{localStorage.setItem('rye',JSON.stringify(S))}catch(e){}
  if(ref)ref.set({json:JSON.stringify(S)}).catch(()=>{})
  if(A)queueSync()
}
try{const l=JSON.parse(localStorage.getItem('rye')||'null');if(l&&l.clients)S=l}catch(e){}
async function initDb(){
  try{
    if(!window.claude)return;
    const u=await claude.use('user'),db=await claude.use('db');
    if(!u||!db)return;
    const id=await u.id();if(!id)return;
    const r=db.doc('data/users/'+id+'/rye'),snap=await r.get();
    if(snap.exists&&snap.data().json){S=JSON.parse(snap.data().json);try{localStorage.setItem('rye',JSON.stringify(S))}catch(e){}}
    else if(S.clients.length)await r.set({json:JSON.stringify(S)});
    ref=r;render()
  }catch(e){}
}

function render(){render0();if(lastSel){const n=$(lastSel);lastSel=null;if(n)fx(n)}}
function render0(){
  const a=$('#app');
  if(view==='detail'){const c=S.clients.find(x=>x.id===sel);if(c){a.innerHTML=detail(c);if(animNext){animNext=false;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('circle[data-to]').forEach(e=>e.style.strokeDashoffset=e.dataset.to)))}return}view='home'}
  const list=S.clients.map(c=>({c,i:info(c)}));
  const due=list.filter(x=>x.i.due);
  const total=S.clients.reduce((s,c)=>s+Number(c.paid||0),0),owed=S.clients.reduce((s,c)=>s+bal(c),0);
  a.innerHTML=(due.length?`<div class="banner"><b>⏰ Package reminders</b>${due.map(x=>`${esc(x.c.name)} — ${x.i.days<0?'ended':x.i.days+' day(s) left'}, ${x.i.left} class(es) remaining`).join('<br>')}</div>`:'')
  +`<div class="stats"><div class="stat"><b>${S.clients.length}</b><span>Clients</span></div><div class="stat tap" data-act="paid"><b>${money(total)}</b><span>Total paid</span></div><div class="stat tap" data-act="owed"><b style="color:${owed?'var(--warn)':'inherit'}">${money(owed)}</b><span>To collect</span></div></div>`
  +`<div class="dd ${clientsOpen?'open':''}" data-act="toggle"><span>Clients (${list.length})</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>`
  +`<div class="shutter ${clientsOpen?'open':''}"><div>`+(list.length?list.map(({c,i})=>`<div class="card tap" data-act="open" data-id="${c.id}">${ring(i.taught,c.sessions,64,7)}<div class="grow"><div class="name${i.done?' done-name':''}">${IMG[c.id]&&IMG[c.id].photo?`<img class="av" src="${IMG[c.id].photo}" alt="">`:''}${esc(c.name)}</div><div class="meta">${i.left} classes left</div><span class="pill ${i.status}">${i.label}</span></div><div class="ct">${contact(c)}</div></div>`).join(''):`<div class="empty">No clients yet.<br>Tap “+ Client” to add your first one.</div>`)+`</div></div>`
  +`<button class="fab" data-act="add">+ Client</button>`
}

function detail(c){
  const i=info(c),im=IMG[c.id]||{},ph=im.photo,ad=im.aadhaar;
  const log=[...c.taught.map(d=>({d,k:'taught'})),...(c.skipI||[]).map(d=>({d,k:'skipI'})),...(c.skipC||[]).map(d=>({d,k:'skipC'}))].sort((a,b)=>a.d<b.d?-1:1);
  const ws=(c.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:1),cur=ws.length?ws[ws.length-1].w:(c.joinWeight||0),chg=c.joinWeight&&cur?Math.round((cur-c.joinWeight)*10)/10:0;
  return `<button class="back" data-act="back">‹ All clients</button>
  <div class="big tap" data-act="cal" style="cursor:pointer">${ring(i.taught,c.sessions,170,14,true,animNext)}<div class="meta" style="font-size:11px">Tap the circle to open the calendar</div></div>
  <div style="text-align:center">${ph?`<img class="avl" src="${ph}" alt=""><br>`:''}<div class="name${i.done?' done-name':''}" style="font-size:20px">${esc(c.name)}</div><div class="meta">${esc(c.phone||'')}</div>${c.address?`<div class="meta">📍 ${esc(c.address)}</div>`:''}${c.disease===true?`<span class="pill dis">Has disease${c.note?' · '+esc(c.note):''}</span>`:c.disease===false?'<span class="pill nodis">No disease</span>':''}<div class="ct" style="justify-content:center;margin-top:10px">${contact(c,'lg')}</div><span class="pill ${i.status}">${i.label}</span></div>

  <div class="stats"><div class="stat"><b>${money(c.fee)}</b><span>Amount to be paid</span></div><div class="stat"><b>${money(c.paid)}</b><span>Amount paid</span></div><div class="stat"><b style="color:${bal(c)?'var(--warn)':'var(--accent2)'}">${money(bal(c))}</b><span>Balance due</span></div></div>
  <div class="meta" style="text-align:center">${show(c.start)} → ${show(i.end)} · ${c.duration}-day package</div>
  <div class="box"><label style="margin-top:0">Date of class</label><input type="date" id="md" value="${today()}">
  <div class="mk"><button data-act="mark">✓ Day taught</button><button class="skipi" data-act="skipi">Skipped by instructor</button><button class="skipc" data-act="skipc">Skipped by client</button></div>
  ${log.length?`<div class="hd" style="margin-top:12px"><label style="margin:0">Class log</label><button class="ghost" data-act="editd">${editDates?'Done':'✎ Edit'}</button></div><div class="dates">${log.map(x=>editDates?`<button class="ghost ${x.k}" data-act="unmark" data-d="${x.d}" data-k="${x.k}">${show(x.d)} ✕</button>`:`<span class="chip ${x.k}">${show(x.d)}${x.k==='skipI'?' · skipped (instructor)':x.k==='skipC'?' · skipped (client)':''}</span>`).join('')}</div>${editDates?'<div class="meta" style="margin-top:8px">Tap a date to remove it</div>':''}`:''}</div>
    <div class="box"><label style="margin:0">Weight</label>
  <div class="stats" style="margin:8px 0"><div class="stat"><b>${c.joinWeight?c.joinWeight+' kg':'—'}</b><span>Joining</span></div><div class="stat"><b>${cur?cur+' kg':'—'}</b><span>Current</span></div><div class="stat"><b>${c.joinWeight&&cur?(chg>0?'+':'')+chg+' kg':'—'}</b><span>Change</span></div></div>
  <label style="margin-top:0">Update weight (kg)</label><div class="row"><input type="number" inputmode="decimal" step="0.1" id="wt" placeholder="e.g. 64.5"><button class="ghost" data-act="wt">Update</button></div>
  ${ws.length?`<div class="dates">${ws.map(x=>`<span class="chip">${show(x.d)} · ${x.w} kg</span>`).join('')}</div>`:''}</div>
  <div class="box"><label style="margin:0">Photo &amp; ID</label>
  <div class="pid"><div class="pcol"><div class="slot ${ph?'has':''}" data-act="${ph?'img':'pick'}" data-k="photo">${ph?`<img src="${ph}" alt="">`:'＋<span>Add photo</span>'}</div><div class="meta">Profile picture</div></div>
  <div class="pcol"><div class="slot ${ad?'has':''}" data-act="${ad?'img':'pick'}" data-k="aadhaar">${ad?'🪪<span>Added · tap to view</span>':'＋<span>Add Aadhaar</span>'}</div><div class="meta">Aadhaar card</div></div></div>
  <div class="meta" style="margin-top:8px;font-size:11px">Photos and ID stay on this device only. They are not included in backups or online sync.</div></div>
  <div class="actions"><button class="ghost" data-act="edit">Edit</button><button class="ghost" data-act="renew">Renew</button><button class="${confirmDel?'danger':'ghost'}" data-act="del">${confirmDel?'Tap to confirm':'Delete'}</button></div>`
}

function openForm(c,mode){
  form={mode,pend:{},id:c&&c.id,dis:c&&c.disease!==undefined?c.disease:null};
  const v=c||{name:'',phone:'',start:today(),duration:30,sessions:12,fee:'',paid:'',address:'',joinWeight:'',disease:null,note:''};
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h2>${mode==='add'?'New client':mode==='renew'?'Renew package':'Edit client'}</h2>
  <label>Name</label><input id="f_name" value="${esc(v.name)}">
  <label>Phone</label><input id="f_phone" type="tel" value="${esc(v.phone)}">
  <label>Address</label><input id="f_addr" value="${esc(v.address)}">
  <label>Joining weight (kg)</label><input id="f_jw" type="number" inputmode="decimal" step="0.1" value="${esc(v.joinWeight)}">
  <label>Package start date</label><input id="f_start" type="date" value="${mode==='renew'?today():v.start}">
  <div class="row"><div><label>Package length (days)</label><input id="f_dur" type="number" inputmode="numeric" value="${v.duration}"></div><div><label>Classes to teach</label><input id="f_ses" type="number" inputmode="numeric" value="${v.sessions}"></div></div>
  <div class="row"><div><label>Amount to be paid (₹)</label><input id="f_fee" type="number" inputmode="decimal" value="${esc(v.fee)}"></div><div><label>Amount paid (₹)</label><input id="f_paid" type="number" inputmode="decimal" value="${mode==='renew'?'':esc(v.paid)}"></div></div>
  <label>Photos (optional)</label><div class="row"><button type="button" class="ghost" data-act="fpick" data-k="photo" id="fp_photo">${c&&IMG[c.id]&&IMG[c.id].photo?'✓ Photo added (change)':'📷 Profile picture'}</button><button type="button" class="ghost" data-act="fpick" data-k="aadhaar" id="fp_aadhaar">${c&&IMG[c.id]&&IMG[c.id].aadhaar?'✓ Aadhaar added (change)':'🪪 Aadhaar card'}</button></div><div class="meta" style="font-size:11px;margin-top:6px">Stored on this device only.</div>
  <label>Health condition</label><div class="seg"><button type="button" class="dis ${v.disease===true?'on':''}" data-act="dis" data-v="1">Has disease</button><button type="button" class="nodis ${v.disease===false?'on':''}" data-act="dis" data-v="0">No disease</button></div>
  <input id="f_note" placeholder="Disease details (optional)" value="${esc(v.note)}" style="margin-top:8px;display:${v.disease===true?'block':'none'}">
  <div class="actions"><button class="ghost" data-act="cancel">Cancel</button><button data-act="save">Save</button></div></div></div>`;
}
function openCal(c){
  const i=info(c),st={};c.taught.forEach(d=>st[d]='t');(c.skipI||[]).forEach(d=>st[d]='i');(c.skipC||[]).forEach(d=>st[d]='c');
  const a=dd(c.start),z=dd(i.end),t=today();let h='',m=new Date(a.getFullYear(),a.getMonth(),1);
  while(m<=z){
    const y=m.getFullYear(),mo=m.getMonth(),n=new Date(y,mo+1,0).getDate(),off=m.getDay();
    h+=`<div class="cmt">${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="cg">${['S','M','T','W','T','F','S'].map(x=>`<span class="wd">${x}</span>`).join('')}${'<span></span>'.repeat(off)}`;
    for(let d=1;d<=n;d++){const k=y+'-'+pad(mo+1)+'-'+pad(d),inr=k>=c.start&&k<=i.end;h+=`<span class="dy ${inr?'in':'out'} ${inr&&st[k]||''} ${k===t?'today':''}">${d}</span>`}
    h+='</div>';m=new Date(y,mo+1,1)
  }
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h2>${esc(c.name)} · calendar</h2><div class="meta">${show(c.start)} → ${show(i.end)} · ${c.taught.length} taught</div>${h}
  <div class="lg"><span><i style="background:#fff"></i>Upcoming / not marked</span><span><i style="background:#8fd19e"></i>Taught</span><span><i style="background:#d9d9d9"></i>Skipped by instructor</span><span><i style="background:#f9d6d6"></i>Skipped by client</span></div>
  <div class="actions"><button class="ghost" data-act="cancel">Close</button></div></div></div>`}
function openList(kind){
  const owed=kind==='owed',rows=S.clients.map(c=>({c,v:owed?bal(c):Number(c.paid||0)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v),tot=rows.reduce((s,r)=>s+r.v,0);
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h2>${owed?'To collect':'Total paid'} · ${money(tot)}</h2><div class="meta">${owed?'Balance due from each client':'Amount received from each client'}. Tap a name to open.</div>${rows.length?rows.map(r=>`<div class="card tap" data-act="open" data-id="${r.c.id}"><div class="grow"><div class="name">${esc(r.c.name)}</div></div><b style="color:${owed?'var(--warn)':'var(--btnink)'}">${money(r.v)}</b>${owed?`<div class="ct">${contact(r.c)}</div>`:''}</div>`).join(''):`<div class="empty">${owed?'Nobody owes you anything 🎉':'No payments recorded yet.'}</div>`}
  <div class="actions"><button class="ghost" data-act="cancel">Close</button></div></div></div>`}
function jwt(t){try{let b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);return JSON.parse(atob(b))}catch(e){return{}}}
function saveAuth(){try{localStorage.setItem('rye_auth',JSON.stringify(A))}catch(e){}}
function startLogin(){if(!isApp)return;$('#lgmsg').textContent='';Android.openUrl(SB+'/auth/v1/authorize?provider=google&prompt=select_account&redirect_to='+encodeURIComponent('com.rye.packagetracker://auth'))}
window.onAuthUrl=function(url){
  const q=new URLSearchParams((url.split('#')[1]||url.split('?')[1]||'')),at=q.get('access_token');
  if(at){const j=jwt(at);A={at,rt:q.get('refresh_token'),exp:Date.now()+(+q.get('expires_in')||3600)*1000,uid:j.sub,email:j.email};saveAuth();$('#login').style.display='none';$('#modal').innerHTML='';syncDown()}
  else{$('#login').style.display='flex';$('#lgmsg').textContent=q.get('error_description')||'Sign-in did not finish. Please try again.'}
};
async function refreshAuth(){
  const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:A.rt})});
  if(!r.ok){if(r.status===400||r.status===401){A=null;try{localStorage.removeItem('rye_auth')}catch(e){}$('#login').style.display='flex'}throw new Error('auth')}
  const j=await r.json();A={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,uid:A.uid,email:A.email};saveAuth()
}
async function sb(path,o){
  o=o||{};if(Date.now()>A.exp-60000)await refreshAuth();
  return fetch(SB+path,{method:o.method||'GET',body:o.body,headers:Object.assign({apikey:KEY,'Content-Type':'application/json',Authorization:'Bearer '+A.at},o.headers||{})})
}
function setMsg(m){syncMsg=m;const e=$('#syncst');if(e)e.textContent=m}
function queueSync(){clearTimeout(syncT);syncT=setTimeout(syncNow,900)}
async function syncNow(){
  if(!A)return false;
  try{setMsg('Saving…');const r=await sb('/rest/v1/app_data',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:A.uid,data:S,updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error(r.status);setMsg('☁ Saved online at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));return true}
  catch(e){setMsg('Could not save online. It will retry on your next change.');return false}
}
async function syncDown(){
  if(!A)return;
  try{setMsg('Syncing…');const r=await sb('/rest/v1/app_data?select=data&user_id=eq.'+A.uid);if(!r.ok)throw new Error(r.status);
    const rows=await r.json(),cd=rows[0]&&rows[0].data;
    if(cd&&Array.isArray(cd.clients)){const m=new Map(S.clients.map(c=>[c.id,c]));cd.clients.forEach(c=>m.set(c.id,c));S={clients:[...m.values()],remind:cd.remind==null?S.remind:cd.remind}}
    try{localStorage.setItem('rye',JSON.stringify(S))}catch(e){}
    render();await syncNow()}
  catch(e){setMsg('Could not reach the server. Check your internet.')}
}
async function doLogout(){
  const ok=await syncNow();
  if(!ok){setMsg('Could not save online, so you were not logged out. Check your internet and try again.');return}
  A=null;try{localStorage.removeItem('rye_auth');localStorage.removeItem('rye_skip')}catch(e){}
  S={clients:[],remind:S.remind};try{localStorage.setItem('rye',JSON.stringify(S))}catch(e){}
  $('#modal').innerHTML='';view='home';render();$('#login').style.display='flex'
}
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('rye_img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
async function imgInit(){idb=await idbOpen();if(!idb)return;await new Promise(res=>{try{const rq=idb.transaction('i').objectStore('i').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){IMG[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}});render()}
function imgSave(id){const o=IMG[id];if(!(o&&(o.photo||o.aadhaar)))delete IMG[id];if(!idb)return;try{const st=idb.transaction('i','readwrite').objectStore('i');IMG[id]?st.put(IMG[id],id):st.delete(id)}catch(e){}}
function delImg(id){delete IMG[id];if(idb)try{idb.transaction('i','readwrite').objectStore('i').delete(id)}catch(e){}}
function commitPend(id){const p=form&&form.pend;if(p&&(p.photo||p.aadhaar)){IMG[id]=Object.assign(IMG[id]||{},p);imgSave(id)}}
function shrink(f,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function openImg(k){const d=(IMG[sel]||{})[k];if(!d)return;$('#modal').innerHTML=`<div class="modal"><div class="sheet"><h2>${k==='photo'?'Profile picture':'Aadhaar card'}</h2><img src="${d}" alt="" style="width:100%;border-radius:12px;margin-top:8px"><div class="actions"><button class="ghost" data-act="pick" data-k="${k}">Replace</button><button class="danger" data-act="rmimg" data-k="${k}">Remove</button></div><button class="ghost" data-act="cancel" style="width:100%">Close</button></div></div>`}
const FI=document.createElement('input');FI.type='file';FI.accept='image/*';FI.style.display='none';document.body.appendChild(FI);
FI.onchange=async()=>{
  const f=FI.files&&FI.files[0];if(!f)return;const k=FI.dataset.k,ctx=FI.dataset.ctx;
  try{const d=await shrink(f,k==='photo'?400:1200,k==='photo'?.8:.7);
    if(ctx==='form'&&form){form.pend[k]=d;const b=$('#fp_'+k);if(b)b.textContent='✓ '+(k==='photo'?'Photo added':'Aadhaar added')}
    else if(sel){IMG[sel]=IMG[sel]||{};IMG[sel][k]=d;imgSave(sel);$('#modal').innerHTML='';render();toast(idb?'Saved on this device':'Saved for this session only')}
  }catch(e){toast('Could not read that image. Try another one.')}
  FI.value=''
};
function setOpen(v){clientsOpen=v;const sh=$('.shutter'),d=$('.dd');if(sh){sh.classList.toggle('open',v);d.classList.toggle('open',v)}}
function openSettings(){
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h2>Settings</h2>
  <label>Remind me this many days before a package ends</label><input id="s_rem" type="number" inputmode="numeric" min="0" value="${S.remind}">
  <div class="meta" style="margin-top:6px">Clients near the end of their package show in the red banner on the home screen.</div>
  ${isApp?(A?`<label style="margin-top:16px">Account</label><div class="meta">Signed in as ${esc(A.email||'Google account')}</div><div class="meta" id="syncst">${esc(syncMsg)}</div><div class="row" style="margin-top:6px"><button class="ghost" data-act="syncnow">Sync now</button><button class="ghost" data-act="logout">Log out</button></div>`:`<label style="margin-top:16px">Account</label><button data-act="glogin" style="width:100%">Sign in with Google to save online</button>`):''}
  <label style="margin-top:16px">Backup &amp; restore</label>
  <div class="row"><button class="ghost" data-act="bk">Share backup</button><button class="ghost" data-act="rs">Restore</button></div>
  <textarea id="s_bk" placeholder="Backup text appears here. To restore, paste a backup here and tap Restore." style="margin-top:8px"></textarea><div class="meta" id="bk_msg"></div>
  <div class="actions"><button class="ghost" data-act="cancel">Cancel</button><button data-act="savesettings">Save</button></div></div></div>`}
function saveForm(){
  const g=id=>$('#'+id).value,name=g('f_name').trim();
  if(!name){$('#f_name').focus();return}
  const base={name,phone:g('f_phone').trim(),address:g('f_addr').trim(),joinWeight:+g('f_jw')||0,disease:form.dis,note:g('f_note').trim(),start:g('f_start')||today(),duration:Math.max(1,+g('f_dur')||30),sessions:Math.max(1,+g('f_ses')||1)},paid=+g('f_paid')||0,fee=+g('f_fee')||0;
  if(form.mode==='add'){const c={id:uid(),...base,fee,paid,taught:[],skipI:[],skipC:[],weights:[]};S.clients.push(c);sel=c.id;view='detail';animNext=true}
  else{
    const c=S.clients.find(x=>x.id===form.id);Object.assign(c,base);
    c.fee=fee;c.paid=paid;if(form.mode==='renew'){c.taught=[];c.skipI=[];c.skipC=[]}
  }
  commitPend(form.mode==='add'?sel:form.id);
  $('#modal').innerHTML='';form=null;persist();render()
}

function fx(n){n.classList.remove('fx');void n.offsetWidth;n.classList.add('fx')}
document.addEventListener('animationend',e=>{if(e.animationName==='pf')e.target.classList.remove('fx')});
document.addEventListener('click',e=>{
  const n=e.target.closest('button,[data-act],a.call');
  if(n){fx(n);const a=n.dataset.act;lastSel=a?'[data-act="'+a+'"]'+(n.dataset.id?'[data-id="'+n.dataset.id+'"]':'')+(n.dataset.d?'[data-d="'+n.dataset.d+'"]':''):null;setTimeout(()=>lastSel=null,80)}
},true);
document.addEventListener('click',e=>{
  if(e.target.closest('a.call')){e.stopPropagation();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,c=S.clients.find(x=>x.id===sel);
  if(act==='open'){$('#modal').innerHTML='';animNext=true;sel=b.dataset.id;view='detail';confirmDel=false;editDates=false,clientsOpen=false;render();scrollTo(0,0)}
  else if(act==='glogin')startLogin();
  else if(act==='skiplogin'){try{localStorage.setItem('rye_skip','1')}catch(e){}$('#login').style.display='none'}
  else if(act==='syncnow')syncDown();
  else if(act==='logout')doLogout();
  else if(act==='pick'||act==='fpick'){FI.dataset.ctx=act==='pick'?'detail':'form';FI.dataset.k=b.dataset.k;FI.value='';FI.click()}
  else if(act==='img')openImg(b.dataset.k);
  else if(act==='rmimg'){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Tap again to remove';return}const k=b.dataset.k;if(IMG[sel]){delete IMG[sel][k];imgSave(sel)}$('#modal').innerHTML='';render()}
  else if(act==='cal')openCal(c);
  else if(act==='paid'||act==='owed')openList(act);
  else if(act==='toggle')setOpen(!clientsOpen);
  else if(act==='settings')openSettings();
  else if(act==='savesettings'){S.remind=Math.max(0,+$('#s_rem').value||0);$('#modal').innerHTML='';persist();render()}
  else if(act==='dis'){const v=b.dataset.v==='1';form.dis=form.dis===v?null:v;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',form.dis!==null&&(x.dataset.v==='1')===form.dis));$('#f_note').style.display=form.dis===true?'block':'none'}
  else if(act==='wt'){const w=+$('#wt').value;if(w>0){c.weights=(c.weights||[]).filter(x=>x.d!==today());c.weights.push({d:today(),w:Math.round(w*10)/10});persist();render()}}
  else if(act==='bk'){const t=JSON.stringify(S),a=$('#s_bk');a.value=t;a.select();try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}$('#bk_msg').textContent='Backup ready. Save it somewhere safe (Drive, email, WhatsApp).';if(window.Android&&Android.share)Android.share(t);else if(navigator.share)navigator.share({text:t}).catch(()=>{})}
  else if(act==='rs'){try{const o=JSON.parse($('#s_bk').value.trim());if(!Array.isArray(o.clients))throw 0;S={clients:o.clients,remind:o.remind==null?3:o.remind};persist();$('#modal').innerHTML='';render()}catch(e){$('#bk_msg').textContent='That backup text is not valid. Paste the whole text and try again.'}}
  else if(act==='back'){view='home';editDates=false;clientsOpen=false;render();setTimeout(()=>setOpen(true),60)}
  else if(act==='editd'){editDates=!editDates;render()}
  else if(act==='add')openForm(null,'add');
  else if(act==='edit')openForm(c,'edit');
  else if(act==='renew')openForm(c,'renew');
  else if(act==='cancel'){$('#modal').innerHTML='';form=null}
  else if(act==='save')saveForm();
  else if(act==='mark'||act==='skipi'||act==='skipc'){const d=$('#md').value||today(),k=act==='mark'?'taught':act==='skipi'?'skipI':'skipC';['taught','skipI','skipC'].forEach(x=>c[x]=(c[x]||[]).filter(y=>y!==d));c[k].push(d);persist();render()}
  else if(act==='unmark'){const k=b.dataset.k||'taught';c[k]=(c[k]||[]).filter(x=>x!==b.dataset.d);persist();render()}
  else if(act==='pay'){const v=+$('#pay').value;if(v>0){c.paid=Number(c.paid||0)+v;persist();render()}}
  else if(act==='del'){if(!confirmDel){confirmDel=true;render();return}delImg(sel);S.clients=S.clients.filter(x=>x.id!==sel);confirmDel=false;view='home';persist();render()}
});
document.addEventListener('change',e=>{if(e.target.dataset.act==='rem'){S.remind=Math.max(0,+e.target.value||0);persist();render()}});
function androidBack(){if($('#modal').innerHTML){$('#modal').innerHTML='';form=null;return true}if(view==='detail'){view='home';editDates=false;clientsOpen=false;render();setTimeout(()=>setOpen(true),60);return true}return false}
render();initDb();imgInit();
try{A=JSON.parse(localStorage.getItem('rye_auth')||'null')}catch(e){}
$('#lglogo').src=$('.logo').src;
if(isApp){if(A)syncDown();else if(!localStorage.getItem('rye_skip'))$('#login').style.display='flex'}
$('#splogo').src=$('.logo').src;
setTimeout(()=>{document.body.classList.remove('loading');$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),800)},2100);
</script>
</body>
</html>
